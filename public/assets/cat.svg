<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  .cat-idle {
    animation: cat-bounce 2400ms steps(2, end) infinite;
  }

  .cat-tail {
    transform-box: fill-box;
    transform-origin: left bottom;
    animation: cat-tail-move 3200ms steps(2, end) infinite;
  }

  .cat-eyes {
    animation: cat-blink 5600ms steps(1, end) infinite;
  }

  @keyframes cat-bounce {
    0%, 72%, 100% { transform: translateY(0); }
    76%, 84% { transform: translateY(-1px); }
  }

  @keyframes cat-tail-move {
    0%, 68%, 100% { transform: translateY(0); }
    72%, 84% { transform: translateY(-1px); }
  }

  @keyframes cat-blink {
    0%, 44%, 47%, 92%, 95%, 100% { opacity: 1; }
    45%, 46%, 93%, 94% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cat-idle,
    .cat-tail,
    .cat-eyes {
      animation: none;
    }
  }
</style>
